{% extends "base.html" %}
{% block title %}Add Lesson — {{ module.title }}{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Add Lesson</h1>
    <p>{{ module.title }}</p>
</section>
<section class="panel">
<form action="{{ url_for('lesson.create_lesson', module_id=module.id) }}" method="post" class="stack">
    <input type="text" name="title" placeholder="Lesson title" required>
    <textarea name="content" placeholder="Lesson content"></textarea>
    <input type="number" name="order" placeholder="Order" value="0">
    <button type="submit">Add Lesson</button>
    <a class="button-link" href="{{ url_for('course.course_detail', course_id=module.course_id) }}">Back to Course</a>

</form>
</section>
{% endblock %}
