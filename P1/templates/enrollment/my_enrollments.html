{% extends "base.html" %}

{% block title %}Your Enrollments{% endblock %}

{% block content %}

<section class="page-header">
    <h1>Your Courses</h1>
</section>

<section class="grid">

    {% for course in courses %}
    <article class="card panel p-3">

        <h2>
            <a href="{{ url_for('course.course_detail', course_id=course.id) }}">
                {{ course.title }}
            </a>
        </h2>

        <p>
            {{ course.description or 'No description yet.' }}
        </p>

        <form action="{{ url_for('enroll_ui.unenroll', course_id=course.id) }}" method="post" >
            <button type="submit" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash me-1"></i>Unenroll
            </button>
        </form>

    </article>

    {% else %}
    <p>You are not enrolled in any courses yet.</p>
    {% endfor %}

</section>

{% endblock %}
