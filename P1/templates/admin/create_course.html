<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Course · Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --sidebar-bg: #14213d;
            --sidebar-bg-active: #1f3357;
            --accent: #2e7d6b;
            --accent-soft: #e6f0ee;
            --page-bg: #f5f6f8;
            --text-muted: #6b7280;
        }

        body {
            background-color: var(--page-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background-color: var(--sidebar-bg);
        }

        .sidebar .brand {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background-color: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            padding: 0.65rem 1.5rem;
            font-size: 0.925rem;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .sidebar .nav-link.active {
            background-color: var(--sidebar-bg-active);
            border-left-color: var(--accent);
            color: #fff;
            font-weight: 500;
        }

        .sidebar .nav-link i {
            font-size: 1.05rem;
            width: 20px;
            text-align: center;
        }

        /* ---------- Topbar ---------- */
        .topbar {
            background-color: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.75rem 1.5rem;
        }

        .topbar .breadcrumb {
            margin-bottom: 0;
            font-size: 0.85rem;
        }

        /* ---------- Content / form ---------- */
        .form-card {
            background-color: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 560px;
        }

        .form-card label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.35rem;
        }

        .form-card .form-control,
        .form-card .form-select {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-card .form-control:focus,
        .form-card .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.2rem rgba(46, 125, 107, 0.15);
        }

        .btn-accent {
            background-color: var(--accent);
            color: #fff;
            font-size: 0.875rem;
        }

        .btn-accent:hover {
            background-color: #256657;
            color: #fff;
        }

        .alert-error {
            background-color: #fdecec;
            border: 1px solid #f3c6c6;
            color: #b3261e;
            border-radius: 6px;
            font-size: 0.875rem;
            padding: 0.65rem 0.9rem;
        }
    </style>
</head>

<body>

    <div class="d-flex">

        <!-- ================= Sidebar ================= -->
        <aside class="sidebar d-flex flex-column">
            <div class="brand d-flex align-items-center gap-2">
                <span class="brand-mark">LMS</span>
                <span class="text-white fw-semibold">Admin Panel</span>
            </div>

            <nav class="nav flex-column mt-2">
                <a class="nav-link" href="{{ url_for('admin_ui.dashboard') }}">
                    <i class="bi bi-grid"></i> Dashboard
                </a>
                <a class="nav-link" href="{{ url_for('admin_ui.list_users') }}">
                    <i class="bi bi-people"></i> User Management
                </a>
                <a class="nav-link active" href="{{ url_for('admin_course.list_admin_courses') }}">
                    <i class="bi bi-journal-bookmark"></i> Course Management
                </a>
            </nav>
        </aside>

        <!-- ================= Main ================= -->
        <div class="flex-grow-1">

            <!-- Topbar -->
            <header class="topbar d-flex justify-content-between align-items-center">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item text-muted">Admin</li>
                        <li class="breadcrumb-item">
                            <a href="{{ url_for('admin_course.list_admin_courses') }}"
                                class="text-muted text-decoration-none">Course Management</a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">Create Course</li>
                    </ol>
                </nav>

                <div class="dropdown">
                    <button class="btn btn-sm btn-light dropdown-toggle d-flex align-items-center gap-2" type="button"
                        data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                        {{ current_user.username if current_user is defined else 'Admin' }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Log
                                out</a></li>
                    </ul>
                </div>
            </header>

            <!-- Page content -->
            <main class="p-4">
                <h4 class="mb-1">Create Course</h4>
                <p class="text-muted mb-4">Add a new course and assign an instructor.</p>

                <div class="form-card">

                    {% if error %}
                    <div class="alert-error mb-3">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('admin_course.create_admin_course') }}">

                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" id="title" name="title" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" name="description" class="form-control" rows="4"></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="instructor_id" class="form-label">Instructor</label>
                            <select id="instructor_id" name="instructor_id" class="form-select" required>
                                <option value="">-- Select Instructor --</option>
                                {% for instructor in instructors %}
                                <option value="{{ instructor.id }}">{{ instructor.email }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-accent">Create Course</button>
                            <a href="{{ url_for('admin_course.list_admin_courses') }}"
                                class="btn btn-light border">Cancel</a>
                        </div>

                    </form>

                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
