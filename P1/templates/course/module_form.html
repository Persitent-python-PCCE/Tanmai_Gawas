{% extends "base.html" %}
{% block title %}Add Module — {{ course.title }}{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Add Module</h1>
    <p>{{ course.title }}</p>
</section>

<section class="panel">
    <form action="{{ url_for('module.create_module', course_id=course.id) }}" method="post" class="stack">
        <input type="text" name="title" placeholder="Module title" required>
        <input type="number" name="order" placeholder="Order" value="0">
        <button type="submit">Create Module</button>
    </form>
    <a class="button-link" href="{{ url_for('course.course_detail', course_id=course.id) }}">Back to Course</a>
</section>
{% endblock %}
